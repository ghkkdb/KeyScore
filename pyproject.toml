[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keyscore"
version = "0.1.0"
description = "键谱：面向游戏乐器的简谱自动演奏工具"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7,<7",
]

[project.scripts]
keyscore = "keyscore.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
keyscore = ["assets/*.png", "assets/*.ico"]
